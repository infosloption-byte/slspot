services:
  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - slspot_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: slspot
      MYSQL_USER: slspot
      MYSQL_PASSWORD: slspot
      MYSQL_ROOT_PASSWORD: slspot-root
    ports:
      - "3307:3306"
    volumes:
      - slspot_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uslspot -pslspot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  slspot_mysql_data:
